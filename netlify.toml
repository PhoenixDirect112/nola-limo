[build]
publish = "."
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "18"
# Exclude documentation/example files from the secrets scanner — they reference
# env var NAMES (e.g. AZURE_CLIENT_SECRET) next to placeholder text, never real values.
SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md,SETUP-INTEGRATIONS.md"
# SITE_URL is the public website URL (https://wmsdeliveryservicellc.com), not a secret.
# We hardcode it in customer-facing email templates and source comments, so the scanner
# would otherwise false-positive every commit.
SECRETS_SCAN_OMIT_KEYS = "SITE_URL"

# ─── API Routes → Netlify Functions ────────────────────────────────────────────
# REQUIRED: Without this, all /api/* calls return 404
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ─── SPA-style clean URLs ───────────────────────────────────────────────────────
[[redirects]]
  from = "/booking"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to = "/confirmation.html"
  status = 200

# ─── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://sandbox.web.squarecdn.com https://web.squarecdn.com https://js.squareup.com 'unsafe-inline';
      style-src 'self' https://fonts.googleapis.com https://sandbox.web.squarecdn.com https://web.squarecdn.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self' https://connect.squareup.com https://connect.squareupsandbox.com https://graph.microsoft.com https://login.microsoftonline.com;
      frame-src https://sandbox.web.squarecdn.com https://web.squarecdn.com;
      """
